name: ustalar-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ustalar_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ustalar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ustalar_password}
      POSTGRES_DB: ${POSTGRES_DB:-ustalar_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ustalar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ustalar_network

  redis:
    image: redis:7-alpine
    container_name: ustalar_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ustalar_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: development
    container_name: ustalar_backend_dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ../apps/backend:/app/apps/backend
      - ../packages:/app/packages
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ustalar_network

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
      target: development
    container_name: ustalar_bot_dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
    volumes:
      - ../apps/bot:/app/apps/bot
      - ../packages:/app/packages
      - bot_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - ustalar_network

  miniapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miniapp
      target: development
    container_name: ustalar_miniapp_dev
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5173:5173"
    volumes:
      - ../apps/miniapp:/app/apps/miniapp
      - ../packages:/app/packages
      - miniapp_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - ustalar_network

networks:
  ustalar_network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  backend_node_modules:
  bot_node_modules:
  miniapp_node_modules:
