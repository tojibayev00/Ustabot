name: ustalar-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ustalar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ustalar_network
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: ustalar_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ustalar_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: production
    container_name: ustalar_backend
    restart: always
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ustalar_network

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
      target: production
    container_name: ustalar_bot
    restart: always
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - ustalar_network

  miniapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miniapp
      target: production
    container_name: ustalar_miniapp
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - ustalar_network

  nginx:
    image: nginx:1.27-alpine
    container_name: ustalar_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - miniapp
    networks:
      - ustalar_network

networks:
  ustalar_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
