name: Deploy

# Bu workflow "main" branch'ga push bo'lganda avtomatik ishga tushadi:
# 1) Har bir app uchun Docker image quriladi va GitHub Container Registry (GHCR)'ga yuklanadi
# 2) (Ixtiyoriy) VPS serverga SSH orqali ulanib, yangi image'lar tortiladi va konteynerlar qayta ishga tushiriladi
#
# Railway yoki Render ishlatilsa: odatda ular repozitoriyni to'g'ridan-to'g'ri ulaydi va
# push bo'lganda o'zlari build+deploy qiladi — bu holda quyidagi "deploy-vps" job kerak emas,
# faqat "build-and-push" orqali image tayyorlab, Railway/Render'da shu image'ni ishlatish mumkin.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/ustalar-topish

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, bot, miniapp]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    # Faqat VPS_HOST secret sozlangan bo'lsa ishga tushadi (Railway/Render ishlatilsa shart emas)
    if: ${{ vars.DEPLOY_TARGET == 'vps' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ustalar-platform
            git pull origin main
            docker compose -f docker/docker-compose.prod.yml pull
            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
